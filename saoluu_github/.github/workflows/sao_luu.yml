# Đặt thư mục saoluu_github/ này thành MỘT KHO GITHUB RIÊNG TƯ KHÁC (vd: APP_KHO_SAOLUU),
# chép kèm thư mục kho/ và scripts/ của app vào đó.
# Secrets cần khai trong kho này (Settings → Secrets and variables → Actions):
#   GOOGLE_CREDENTIALS = toàn bộ nội dung file JSON tài khoản dịch vụ
#   SHEET_ID_DANH_MUC  = ID file Google Sheets DANH MỤC
#   SHEET_ID_NM1       = ID file PHÁT SINH của NM1 (đổi mỗi năm khi mở file mới)
#   SHEET_ID_NM2       = ID file PHÁT SINH của NM2
#   (dữ liệu chưa tách nhà máy thì dùng SHEET_ID_PHAT_SINH thay cho hai dòng trên)
name: Sao luu du lieu kho
on:
  schedule:
    - cron: "0 19 * * 0"   # 2 giờ sáng thứ Hai giờ Việt Nam (19:00 UTC Chủ nhật)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sao-luu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas openpyxl gspread google-auth
      - env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID_DANH_MUC: ${{ secrets.SHEET_ID_DANH_MUC }}
          SHEET_ID_PHAT_SINH: ${{ secrets.SHEET_ID_PHAT_SINH }}
          SHEET_ID_NM1: ${{ secrets.SHEET_ID_NM1 }}
          SHEET_ID_NM2: ${{ secrets.SHEET_ID_NM2 }}
        run: python scripts/cong_cu.py sao_luu du_lieu
      - run: |
          git config user.name "sao-luu-tu-dong"
          git config user.email "sao-luu@users.noreply.github.com"
          git add du_lieu
          git diff --cached --quiet || git commit -m "Sao luu $(date -u +%Y-%m-%d)"
          git push
